host: apibackenddev.onrender.com
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.swagger.io/support
  description: API Backend Documentation
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: API Backend
  version: "1.0"
paths:
  /{id}/api-key:
    get:
      consumes:
      - application/json
      description: Get API key info for workspace
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get API key info
      tags:
      - api_tokens
    post:
      consumes:
      - application/json
      description: Generate a new API key for workspace
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Generate a new API key
      tags:
      - api_tokens
    put:
      consumes:
      - application/json
      description: Regenerate an existing API key for workspace
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Regenerate an existing API key
      tags:
      - api_tokens
  /{id}/api-key/revoke:
    put:
      consumes:
      - application/json
      description: Revoke an existing API key for workspace
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Revoke an existing API key
      tags:
      - api_tokens
  /ai/security/review:
    post:
      consumes:
      - application/json
      description: Analyse a completed security scan using AI to produce a unified,
        prioritised security report combining ZAP alerts and custom security checks
      parameters:
      - description: AI security analysis request payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AISecurityAnalysisRequest'
      produces:
      - application/json
      responses:
        "200":
          description: AI security analysis report
          schema:
            $ref: '#/definitions/dto.SecurityAnalysisResponse'
        "400":
          description: Invalid request, scan not completed, or incomplete scan data
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Scan not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: AI analysis failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: AI analyse security scan
      tags:
      - AI
  /ai/testcase/review:
    post:
      consumes:
      - application/json
      description: Analyze a test suite and its associated request using AI to identify
        missing, weak, or incorrect test cases
      parameters:
      - description: AI test case review request payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/testsuite.AITestCaseReviewRequest'
      produces:
