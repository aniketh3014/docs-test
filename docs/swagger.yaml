        required: true
        type: string
      - description: 'Request chain update request. You can update: name (required),
          isImportant (optional), environmentId (optional), and chainRequests (optional,
          array of UpdateChainRequest). If chainRequests is provided, it is treated
          as the complete set of requests for the chain: any existing chain requests
          not present in this array will be deleted from the database. Each UpdateChainRequest
          requires: id, name, order, method, url, bodyType, authorizationType, authorization.
          Optional: description, bodyFormData, bodyRawContent, headers, params, extractVariables.'
        in: body
        name: requestChain
        required: true
