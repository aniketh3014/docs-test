      - description: Spec ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 'Stage: ''preview'' or ''apply'''
        in: query
        name: stage
        required: true
        type: string
      - description: 'Apply payload (for stage=apply): { sessionId, testSuiteIds }'
        in: body
        name: body
        schema:
